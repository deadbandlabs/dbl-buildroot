# RAUC system configuration for MYD-YF135
# A/B OTA with readonly factory fallback + overlay
# Installed as /etc/rauc/system.conf with optional additions (external.mk)

[system]
compatible=myd-yf135
bootloader=uboot
data-directory=/var/lib/rauc
mountprefix=/run/rauc

[keyring]
# BR2_PACKAGE_DBL_RAUC_KEYRING
# Verify cert validity against bundle signing time (RTC not guaranteed)
path=/etc/rauc/keyring.pem
use-bundle-signing-time=true

[slot.rootfs.a]
device=/dev/ubi0_0
type=ubivol
bootname=A

[slot.rootfs.b]
device=/dev/ubi0_1
type=ubivol
bootname=B

[slot.rootfs.factory]
device=/dev/ubi0_2
type=ubivol
bootname=factory
readonly=true

# Bootloader update slot, maps to fip-active on raw NAND
# Bundles may omit [image.bootloader] for independent rootfs install
# Note: fip-factory is not intended to be managed by RAUC normally except by special bundles
[slot.bootloader.active]
device=/dev/mtd/by-name/fip-active
type=nand
