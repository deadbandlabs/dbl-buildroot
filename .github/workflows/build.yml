---
name: Build

"on":
  push:
    branches:
      - main
      - "release/*"

  pull_request:
    branches:
      - main
      - "release/*"

  workflow_dispatch:

"jobs":
  lockfile:
    name: Check lockfile is up-to-date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Set up Nix environment
        uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Check lockfile
        uses: ./.github/actions/lockfile

  # Build and push the toolchain SDK to cachix first
  # Allows both the nix image build and the make (shell) build to use it
  toolchain:
    name: Build + cache toolchain SDK (nix)
    needs: lockfile
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true
      - name: Set up Nix environment
        uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Build toolchain SDK
        run: nix build .#toolchain --print-build-logs

  image:
    name: Build release image (nix)
    needs: toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up Nix environment
        uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build
        id: build
        uses: ./.github/actions/build
        with:
          build-mode: nix-build
          nix-flake: .
          project-name: dbl-buildroot
          build-sdk: true

      - name: Upload image artifacts
        if: ${{ steps.build.outputs.images-dir != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: myc-yf135-images
          path: ${{ steps.build.outputs.images-dir }}/
          if-no-files-found: error

      - name: Upload SDK artifacts
        if: ${{ steps.build.outputs.sdk-dir != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: myc-yf135-sdk
          path: ${{ steps.build.outputs.sdk-dir }}/
          if-no-files-found: error

  debug:
    name: Build debug images (make)
    needs: toolchain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Set up Nix environment
        uses: ./.github/actions/setup-nix
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build
        id: build
        uses: ./.github/actions/build
        with:
          build-mode: shell
          nix-flake: .
          build-command: >-
            bash -c 'set -e;
            make debug VERIFIED=1 SOC=135d;
            cp -a output/debug/images output/images-135d;
            for m in debug programmer consent; do
            make MODE=$m optee-os-dirclean arm-trusted-firmware-dirclean; done;
            make debug VERIFIED=1 SOC=135f;
            cp -a output/debug/images output/images-135f'
          project-name: dbl-buildroot
          images-path: output/images-135f/
          dl-cache-path: dl/
          ccache-path: output/ccache/
          host-cache-paths: |
            output/debug/host/
            output/debug/build/host-*/
          dl-key-files: buildroot.lock inputs.nix
          ccache-key-files: >-
            inputs.nix
            configs/myc_yf135_defconfig
            configs/myc_yf135_debug.fragment
            configs/myc_yf135_verified.fragment
            board/myc-yf135/linux.config
            board/myc-yf135/linux-debug.fragment
            board/myc-yf135/linux-verified.fragment
            board/myc-yf135/uboot.config
            board/myc-yf135/uboot-debug.fragment
            board/myc-yf135/uboot-verified.fragment
          host-toolchain-key-files: >-
            inputs.nix
            toolchain.lock
          host-key-files: >-
            configs/myc_yf135_defconfig
            configs/myc_yf135_debug.fragment

      - name: Upload 135D debug image artifacts
        uses: actions/upload-artifact@v7
        with:
          name: myc-yf135-135d-debug-images
          path: output/images-135d/
          if-no-files-found: error

      - name: Upload 135F debug image artifacts
        if: ${{ steps.build.outputs.images-dir != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: myc-yf135-135f-debug-images
          path: ${{ steps.build.outputs.images-dir }}/
          if-no-files-found: error
