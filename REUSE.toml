version = 1

[[annotations]]
path = [
  ".envrc",
  ".git-blame-ignore-revs",
  ".githooks/pre-commit",
  ".gitignore",
  ".pre-commit-config.yaml",
  ".yamllint",
  ".cz.toml",
  "external.desc",
  "buildroot.lock",
  "toolchain.lock",
  "flake.lock",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Deadband Inc."
SPDX-License-Identifier = "CC0-1.0"

[[annotations]]
path = [
  "board/myc-yf135/flashlayout.tsv",
  "board/myc-yf135/linux-debug.fragment",
  "board/myc-yf135/uboot-debug.fragment",
  "board/myc-yf135/uboot-programmer.fragment",
  "board/myc-yf135/linux-verified.fragment",
  "board/myc-yf135/uboot-verified.fragment",
  "configs/myc_yf135_debug.fragment",
  "configs/myc_yf135_external_toolchain.fragment",
  "configs/myc_yf135_programmer.fragment",
  "configs/myc_yf135_consent.fragment",
  "configs/myc_yf135_verified.fragment",
  "board/myc-yf135/linux.config",
  "board/myc-yf135/rootfs-overlay/boot/extlinux/extlinux.conf",
  "README.md",
  "board/myc-yf135/insecure-test-key/README.md",
  "CONTRIBUTING.md",
  "SECURITY.md",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Deadband Inc."
SPDX-License-Identifier = "GPL-2.0-or-later"

# Public, insecure test key material
[[annotations]]
path = [
  "board/myc-yf135/insecure-test-key/insecure-test-key.key",
  "board/myc-yf135/insecure-test-key/insecure-test-key.crt",
  "board/myc-yf135/insecure-test-key/insecure-tbb-key.pem",
  "board/myc-yf135/insecure-test-key/insecure-deviceid-ca.crt",
  "board/myc-yf135/dbl-bootid-example.bin",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Deadband Inc."
SPDX-License-Identifier = "CC0-1.0"

# Carry patches for upstream projects take the license of the patched project
[[annotations]]
path = "board/myc-yf135/patches/arm-trusted-firmware/*.patch"
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Deadband Inc."
SPDX-License-Identifier = "BSD-3-Clause"

# Package hash files are factual upstream checksum data, not authored code
[[annotations]]
path = "package/**/*.hash"
precedence = "aggregate"
SPDX-FileCopyrightText = "NONE"
SPDX-License-Identifier = "CC0-1.0"
